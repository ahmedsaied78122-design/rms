[project]
name = "rms"
authors = [{ name = "RMS Project" }]
description = "Restaurant and retail operations for ERPNext"
requires-python = ">=3.10,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.111.0,<16.0.0"
erpnext = ">=15.111.0,<16.0.0"
arab_streaming = ">=0.2.0,<0.3.0"
